version: v2
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  # wire PR #49, b30fba8: transitive SDK protocol closure.
  - directory: third_party/wire/proto
    paths:
      - third_party/wire/proto/task/v1/msg_session.proto
      - third_party/wire/proto/task/v1/params.proto
      - third_party/wire/proto/task/v1/session.proto
      - third_party/wire/proto/nexus/v1/dispatch.proto
      - third_party/wire/proto/nexus/v1/ingress.proto
      - third_party/wire/proto/nexus/v1/sdk_auth.proto
      - third_party/wire/proto/shared/v1/amount.proto
      - third_party/wire/proto/shared/v1/common.proto
      - third_party/wire/proto/shared/v1/evidence.proto
      - third_party/wire/proto/shared/v1/model_profile.proto
      - third_party/wire/proto/shared/v1/rest_encoding.proto
      - third_party/wire/proto/task/v1/assignment.proto
      - third_party/wire/proto/task/v1/commit.proto
      - third_party/wire/proto/task/v1/dispatch.proto
      - third_party/wire/proto/task/v1/evidence.proto
      - third_party/wire/proto/task/v1/infer_receipt.proto
      - third_party/wire/proto/task/v1/msg_assignment.proto
      - third_party/wire/proto/task/v1/open_verify.proto
      - third_party/wire/proto/task/v1/result.proto
      - third_party/wire/proto/task/v1/settlement.proto
  # wire's on-chain protos carry cosmos / gogo annotations, and protoc-gen-es also generates an
  # import for the annotation files themselves, so these must be generated too or the internal
  # src/gen imports dangle. Taken file by file rather than pulling in the whole cosmos-sdk /
  # gogo-proto modules. coin.proto is a real type dependency: model_profile.proto has a
  # cosmos.base.v1beta1.Coin field.
  - module: buf.build/cosmos/cosmos-sdk
    paths:
      - cosmos/base/v1beta1/coin.proto
      - cosmos/msg/v1/msg.proto
      - amino/amino.proto
  - module: buf.build/cosmos/cosmos-proto
    paths:
      - cosmos_proto/cosmos.proto
  - module: buf.build/cosmos/gogo-proto
    paths:
      - gogoproto/gogo.proto
