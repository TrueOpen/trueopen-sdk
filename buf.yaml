version: v2
modules:
  # The single authority for the contract: TrueOpen/wire (submodule, pinned at v0.1.1).
  # This repository keeps no hand-copied proto: a hand-copied subset drifts silently, while nexus
  # compares order bytes with DiscardUnknown + proto.Equal, so one wrong field number rejects the
  # whole order. wire also publishes the nexus.v1.IngressAPI service, so the on-chain contract and
  # the nexus service surface come from the same commit.
  - path: third_party/wire/proto
# wire's on-chain protos carry gogoproto / cosmos_proto / amino annotations and a
# cosmos.base.v1beta1.Coin field, so the dependency set matches wire's own buf.yaml.
# (ingress.proto itself has no import.)
deps:
  - buf.build/cosmos/cosmos-proto
  - buf.build/cosmos/cosmos-sdk
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
  - buf.build/protocolbuffers/wellknowntypes
